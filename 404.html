<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="text-scale" content="scale">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mengalihkan ke Dashboard PARKEE...</title>
  <meta http-equiv="refresh" content="2; url=./">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --title: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #131b2e;
        --border: #1e293b;
        --title: #f1f5f9;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      min-height: 100svh;
      margin: 0;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--title);
    }
    .box {
      width: min(100%, 440px);
      text-align: center;
      padding: 2rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
      color: var(--title);
    }
    p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 1.25rem;
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover {
      color: var(--accent-hover);
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>404 - Halaman Tidak Ditemukan</h1>
    <p>Anda akan dialihkan ke halaman utama Dashboard PARKEE...</p>
    <p><a href="./">Klik di sini jika tidak otomatis dialihkan</a></p>
  </main>
</body>
</html>
